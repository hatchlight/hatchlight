version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Waits a week after a release, so a hijacked version is usually pulled
    # before it reaches a pull request here.
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # Waits a week after a release, so a hijacked version is usually pulled
    # before it reaches a pull request here.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      bun:
        update-types: [minor, patch]
    ignore:
      # Version 6 needs a newer Vite than the 6.x line the apps use;
      # move both together.
      - dependency-name: "@vitejs/plugin-react"
        update-types: [version-update:semver-major]
    labels: [dependencies]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    # Waits a week after a release, so a hijacked version is usually pulled
    # before it reaches a pull request here.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      cargo:
        update-types: [minor, patch]
    labels: [dependencies]
