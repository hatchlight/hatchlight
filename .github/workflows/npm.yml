name: npm and MCP Registry

# Publishes the npm package `hatchlight` (scripts/npm-package.ts) and its
# entry in the official MCP Registry (server.json). Pull requests build the
# package and validate the entry. A v* tag also publishes both, from jobs
# that run no project code and only get an OIDC token inside the `release`
# environment (v* tags only). Neither needs a stored token.
#
# npm: the trusted publisher (this repository, npm.yml, environment release)
# may only stage a version. A maintainer then approves it on npmjs.com
# (Staged Packages) with their security key, so CI alone cannot publish.
# The registry checks the package on npm, so its job waits for that approval
# for up to an hour; re-run it if the approval came later.
on:
  pull_request:
    paths:
      - server.json
      - scripts/npm-package.ts
      - packages/**
      - apps/web/**
      - package.json
      - bun.lock
      - .github/workflows/npm.yml
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned on purpose: change it deliberately, after reading its release notes.
  MCP_PUBLISHER_VERSION: v1.8.16

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true # a release build never restores a shared cache
      - run: bun install --frozen-lockfile
      - run: bun test packages/cli/src/server-json.test.ts
      - run: bun run build
      - run: bun scripts/npm-package.ts
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download mcp-publisher and check its signature
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          file="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLO "${base}/${file}"
          curl -fsSLO "${base}/${file}.sigstore.json"
          cosign verify-blob "${file}" \
            --bundle "${file}.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          tar xzf "${file}" mcp-publisher
      - run: ./mcp-publisher validate server.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: |
            dist/npm
            server.json
            mcp-publisher
          if-no-files-found: error
          retention-days: 7

  npm:
    name: Stage on npm
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check the versions against the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Staged publishing needs npm 11.15 or later; Node 24 brings it.
          node -e 'const [a, b] = process.argv[1].split(".").map(Number); if (a < 11 || (a === 11 && b < 15)) { console.error("npm " + process.argv[1] + " is older than 11.15"); process.exit(1); }' "$(npm --version)"
          for version in \
            "$(jq -r .version dist/npm/package.json)" \
            "$(jq -r .version server.json)" \
            "$(jq -r '.packages[0].version' server.json)"; do
            test "v${version}" = "${TAG}" || { echo "Tag ${TAG} but version ${version}"; exit 1; }
          done
      # A re-run finds a version that is already on npm and stages nothing.
      - name: Stage on npm
        env:
          TAG: ${{ github.ref_name }}
        working-directory: dist/npm
        run: |
          if npm view "hatchlight@${TAG#v}" version >/dev/null 2>&1; then
            echo "hatchlight ${TAG#v} is already on npm"
          else
            npm stage publish --access public
            echo "Approve hatchlight ${TAG#v} on npmjs.com, under Staged Packages." >> "$GITHUB_STEP_SUMMARY"
          fi

  registry:
    name: Publish to the MCP Registry
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: release
    permissions:
      contents: read
      id-token: write # MCP Registry login
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
      - name: Wait for the maintainer to approve the npm version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for _ in $(seq 1 60); do
            if npm view "hatchlight@${TAG#v}" version >/dev/null 2>&1; then exit 0; fi
            sleep 60
          done
          echo "hatchlight ${TAG#v} is not on npm yet: approve it, then re-run this job."
          exit 1
      - name: Publish
        run: |
          chmod +x mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
