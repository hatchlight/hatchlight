name: npm and MCP Registry

# Publishes the npm package `hatchlight` (scripts/npm-package.ts) and its
# entry in the official MCP Registry (server.json). Pull requests build the
# package and validate the entry. A v* tag also publishes both, from a job
# that runs no project code and only gets an OIDC token inside the `release`
# environment (v* tags only): npm through trusted publishing with
# provenance, the registry through GitHub OIDC. Neither needs a stored token.
#
# npm's trusted publishing only works for a package that exists: the first
# version (0.4.1) was published by hand, then the trusted publisher was set to
# this repository, workflow npm.yml, environment release.
on:
  pull_request:
    paths:
      - server.json
      - scripts/npm-package.ts
      - packages/**
      - apps/web/**
      - package.json
      - bun.lock
      - .github/workflows/npm.yml
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned on purpose: change it deliberately, after reading its release notes.
  MCP_PUBLISHER_VERSION: v1.8.16

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test packages/cli/src/server-json.test.ts
      - run: bun run build
      - run: bun scripts/npm-package.ts
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download mcp-publisher and check its signature
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          file="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLO "${base}/${file}"
          curl -fsSLO "${base}/${file}.sigstore.json"
          cosign verify-blob "${file}" \
            --bundle "${file}.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          tar xzf "${file}" mcp-publisher
      - run: ./mcp-publisher validate server.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: |
            dist/npm
            server.json
            mcp-publisher
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing and the MCP Registry login
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the versions against the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          npm install -g npm@11 # trusted publishing needs npm 11.5 or later
          for version in \
            "$(jq -r .version dist/npm/package.json)" \
            "$(jq -r .version server.json)" \
            "$(jq -r '.packages[0].version' server.json)"; do
            test "v${version}" = "${TAG}" || { echo "Tag ${TAG} but version ${version}"; exit 1; }
          done
      # A re-run after a failed registry step finds this version on npm.
      - name: Publish to npm
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if npm view "hatchlight@${TAG#v}" version >/dev/null 2>&1; then
            echo "hatchlight ${TAG#v} is already on npm"
          else
            npm publish dist/npm --access public --provenance
          fi
      - name: Publish to the MCP Registry
        run: |
          chmod +x mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
