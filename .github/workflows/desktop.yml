name: Desktop

# Builds the installers. A tag such as v0.1.0 also drafts a release with them;
# otherwise they are kept as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
          - os: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    # The update signing keys live in the release environment, which only
    # opens for v* tags.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          # Release builds never restore a cache someone else could have written.
          no-cache: true
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.rust-target }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: bun install --frozen-lockfile
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages; the app checks them with the public key
          # in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bunx tauri
          # Update packages are made only for tags, where the signing key is;
          # other builds still produce the installers.
          args: ${{ matrix.args }} ${{ startsWith(github.ref, 'refs/tags/v') && '--config src-tauri/tauri.release.conf.json' || '' }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Hatchlight ${{ github.ref_name }}
          releaseDraft: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hatchlight-${{ matrix.os }}-${{ matrix.rust-target || 'native' }}
          path: apps/desktop/src-tauri/target/**/release/bundle/
          if-no-files-found: error

  # Signs the Windows installers through SignPath Foundation
  # (CODE_SIGNING_POLICY.md), then puts them back in the release with new
  # update signatures, since the updater checks the signed bytes. Waits for an
  # approver to accept the request on SignPath. Skipped until the project is
  # set up there: the repository variable SIGNPATH_ORGANIZATION_ID and the
  # release environment's secret SIGNPATH_API_TOKEN.
  sign-windows:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # The release is still a draft, which only a token that can write sees.
      contents: write
      # SignPath reads the unsigned artifact from this run.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hatchlight-windows-latest-native
          path: bundle
      - name: Pick the installers
        run: |
          mkdir unsigned
          find bundle \( -name '*-setup.exe' -o -name '*.msi' \) -exec cp -- {} unsigned/ \;
          ls unsigned
          test "$(find unsigned -type f | wc -l)" -eq 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: unsigned
        with:
          name: hatchlight-windows-unsigned
          path: unsigned/
          if-no-files-found: error
      - uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: hatchlight
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Each release is approved by hand; a few hours leaves time for it.
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed
      - name: Check the signatures
        run: |
          sudo apt-get update
          sudo apt-get install -y osslsigncode
          for file in signed/*; do
            osslsigncode verify -in "$file" > verify.txt 2>&1 || true
            cat verify.txt
            grep -q 'SignPath Foundation' verify.txt
          done
      - name: Sign the updates again
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for file in signed/*; do
            (cd apps/desktop && bunx tauri signer sign "$GITHUB_WORKSPACE/$file")
          done
      - name: Put the signed installers in the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: bun scripts/release-signed.ts "$TAG" signed

  # Signed build provenance for every installer, made with GitHub's artifact
  # attestations: `gh attestation verify <file> --repo hatchlight/hatchlight`
  # checks a file came from this workflow at this commit. The signed bundle is
  # also added to the release as hatchlight.sigstore.json. It waits for the
  # Windows signing, which may be skipped.
  provenance:
    needs: [build, sign-windows]
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.build.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.sign-windows.result)
    runs-on: ubuntu-latest
    permissions:
      # The release is still a draft, which only a token that can write sees.
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download the release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir files
          rm -f files/hatchlight.sigstore.json
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: files/*
      - name: Add the provenance to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp -- "$BUNDLE" hatchlight.sigstore.json
          gh release upload "$TAG" hatchlight.sigstore.json --repo "$GITHUB_REPOSITORY" --clobber
