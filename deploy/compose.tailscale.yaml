# Hatchlight on your tailnet, with HTTPS, and nothing opened on the host or
# the internet: only devices signed in to your Tailscale network reach it.
# The recommended way. See docs/self-hosting.md.
#
#   1. In the Tailscale admin console, turn on HTTPS certificates (DNS page)
#      and make an auth key (Settings > Keys). A tagged, reusable key suits a
#      server.
#   2. TS_AUTHKEY=tskey-auth-... TAILNET=example-tailnet.ts.net \
#        docker compose -f deploy/compose.tailscale.yaml up -d
#   3. docker compose -f deploy/compose.tailscale.yaml logs hatchlight
#      shows the setup code; open https://hatchlight.<your tailnet>.ts.net
name: hatchlight

services:
  tailscale:
    # A version, not a digest, on purpose: it gets its security fixes.
    image: tailscale/tailscale:v1.104
    container_name: hatchlight-tailscale
    hostname: hatchlight
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?Set TS_AUTHKEY to a Tailscale auth key}
      TS_HOSTNAME: hatchlight
      TS_STATE_DIR: /var/lib/tailscale
      # `tailscale serve`: HTTPS on 443, a Tailscale certificate, to Hatchlight.
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
    configs:
      - source: serve
        target: /config/serve.json
    volumes:
      - tailscale:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    # No ports: nothing is published on the host.

  hatchlight:
    image: ${HATCHLIGHT_IMAGE:-ghcr.io/hatchlight/hatchlight:latest}
    container_name: hatchlight
    restart: unless-stopped
    # Shares the Tailscale container's network: Tailscale's proxy reaches it
    # on 127.0.0.1, and nothing else can.
    network_mode: service:tailscale
    depends_on:
      - tailscale
    # Only what the entrypoint needs, as root, to hand the volumes to PUID:PGID
    # and become that user; the app itself ends up with no capabilities.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN # give the volumes to PUID:PGID
      - DAC_OVERRIDE # ... whatever their current owner allows
      - FOWNER # make /data and /trainer private
      - SETUID # become PUID
      - SETGID # become PGID
      - SETPCAP # drop every capability before starting the app
    environment:
      # Tailscale's proxy and the health check use loopback: nothing else
      # on the tailnet reaches Hatchlight around the proxy.
      HATCHLIGHT_HOST: 127.0.0.1
      HATCHLIGHT_PUBLIC_URL: https://hatchlight.${TAILNET:?Set TAILNET to your tailnet name, such as example-tailnet.ts.net}
      # The proxy is on loopback: its X-Forwarded-* headers are believed.
      HATCHLIGHT_TRUSTED_PROXIES: 127.0.0.1,::1
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - data:/data
      - models:/models
      - trainer:/trainer
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

configs:
  serve:
    content: |
      {
        "TCP": { "443": { "HTTPS": true } },
        "Web": {
          "$${TS_CERT_DOMAIN}:443": {
            "Handlers": { "/": { "Proxy": "http://127.0.0.1:4096" } }
          }
        }
      }

volumes:
  tailscale:
  data:
  models:
  trainer:
